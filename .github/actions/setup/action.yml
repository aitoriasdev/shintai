name: 'Set up Shintai'
description: 'Node.js, Yarn through Corepack, cached dependencies and, optionally, Playwright Chromium.'

inputs:
  playwright:
    description: 'Install Playwright Chromium and its system libraries.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # The oldest Node.js that `engines.node` allows. It still bundles Corepack.
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Locate the Yarn cache
      id: yarn-cache
      shell: bash
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    - name: Install Playwright Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: yarn playwright install --with-deps chromium
